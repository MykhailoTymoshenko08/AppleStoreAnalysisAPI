version: '3.8'

services:
  backend:
    build: ./backend
    container_name: review_analyzer_backend
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: review_analyzer_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped